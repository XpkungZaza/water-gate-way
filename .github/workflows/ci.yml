# CI: every push and pull request runs the same gate as a manual release.
# WHY pinned SHAs: a moved tag on a third-party action would run unreviewed code with this repo's token.
# WHY Node 20.20.2: the droplet runs it; test on what ships. Raise both together.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.20.2"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Test, typecheck, lint, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # WHY --ignore-scripts: no dependency needs an install script to build or test here,
      # so a compromised package's postinstall never runs in CI.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx vitest run
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Blocking: no high or critical advisory in any dependency (prod or dev). Reads the lockfile only.
      - run: npm audit --audit-level=high
