# One app container. pull-deploy.sh runs it twice with different project names and variables:
#   project wgw-candidate: WGW_PORT=3100, TELEMETRY_RECORD=0 (smoke test, must not write DB rows)
#   project wgw:           WGW_PORT=3000, TELEMETRY_RECORD=1 (live)
# WHY the image is a variable: the deployer pins the exact digest it tested (image@sha256:...), not a moving tag.
services:
  app:
    image: ${WGW_IMAGE:?set by pull-deploy.sh}
    env_file: ${ENV_FILE:?set by pull-deploy.sh}
    environment:
      TELEMETRY_RECORD: ${TELEMETRY_RECORD:-1}
    # The server binds 0.0.0.0 inside the container; only this publish maps it, and only to host loopback.
    ports:
      - "127.0.0.1:${WGW_PORT:-3000}:3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The droplet has ~450 MB RAM and no swap.
    mem_limit: 256m
    # Inside the bridge network 127.0.0.1 is the container itself; point app.env at host.docker.internal
    # to reach Postgres / MQTT / go2rtc on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
